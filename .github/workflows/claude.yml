name: Builder (Claude Code)

# The Architect opens an issue or comments with "@claude" -> this job wakes
# Claude Code on a GitHub runner, which builds the round on a branch, runs the
# checks, and opens a pull request. The `if:` below is the only place any of
# this is enforced — three guards, all required:
#   1. the trigger text: '@claude' in the relevant body/title, checked per
#      event type (issue body/title, comment body, or review body);
#   2. github.event.sender.type != 'Bot', so a bot — including this workflow's
#      own PR/issue comments — can never be the one that starts a run;
#   3. github.event.<source>.author_association is OWNER, MEMBER or
#      COLLABORATOR, so only someone with real standing on the repo can
#      trigger it, not any account that can merely open an issue or comment.

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  # One round at a time: two builders editing index.html at once would collide.
  group: siyagah-builder
  cancel-in-progress: false

jobs:
  build:
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # ship-check compares against origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # tools/harness.mjs imports 'playwright' (or finds it under `npm root -g`).
      # The Claude Code sandbox ships Chromium; a GitHub runner does not.
      - name: Install Playwright + Chromium for tools/app-check.mjs
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 250
            --allowedTools "Bash(node *),Bash(npx playwright *),Bash(git *),Bash(gh pr *),Bash(gh issue *),Read,Edit,Write,Glob,Grep"
