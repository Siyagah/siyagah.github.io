name: Builder (Claude Code)

# The Architect opens an issue or comments with "@claude" -> this job wakes
# Claude Code on a GitHub runner, which builds the round on a branch, runs the
# checks, and opens a pull request. Only people with write access to the repo
# can trigger it, and bots cannot, so it cannot loop on its own comments.

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  # One round at a time: two builders editing index.html at once would collide.
  group: siyagah-builder
  cancel-in-progress: false

jobs:
  build:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # ship-check compares against origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # tools/harness.mjs imports 'playwright' (or finds it under `npm root -g`).
      # The Claude Code sandbox ships Chromium; a GitHub runner does not.
      - name: Install Playwright + Chromium for tools/app-check.mjs
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 250
            --allowedTools "Bash(node *),Bash(npx playwright *),Bash(git *),Bash(gh pr *),Bash(gh issue *),Read,Edit,Write,Glob,Grep"
