# Siyagah — verification workflow (CANDIDATE)
#
# Master Plan 2026-09-19, Phase 1: "add CI locally as a candidate workflow but
# do not enable branch protection without owner authority."
#
# This file makes the checks RUN on every push and pull request. It does not
# make them BLOCK anything: turning a check into a required status is a
# repository setting, and it is the owner's to make, not a builder's.
#
# To make these blocking, the owner goes to:
#   Settings ▸ Branches ▸ Add branch protection rule ▸ main
#   ▸ "Require status checks to pass before merging" ▸ tick "fast" and "full"
# Nothing else is needed; the jobs below already report their status.

name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # Pinned, and pinned in ONE place. The first cut of this workflow ran
  # `npx --yes playwright@latest install --with-deps chromium`, which downloads
  # a browser but installs no importable package — `npx` fetches into its own
  # cache, and tools/harness.mjs imports `playwright` from the project or from
  # `npm root -g`, neither of which npx populates. Runs 1 and 2 therefore
  # downloaded 300 MB of Chromium and then failed every browser suite at
  # `import playwright`, reporting "the check itself threw" 35 times:
  #   https://github.com/Siyagah/siyagah.github.io/actions/runs/35414435398
  #   https://github.com/Siyagah/siyagah.github.io/actions/runs/35414852252
  # A global install puts it exactly where the harness looks, and the browser
  # is installed by that same pinned package so the two cannot drift.
  PLAYWRIGHT_VERSION: '1.56.1'

jobs:
  fast:
    # ~5 seconds, no browser. Catches the things that make an update fail to
    # reach a device, or quietly lose the notebook.
    name: fast (version, #nd, precache, manifest, legacy seal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ship-check compares the version against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ship-check REFUSES to pass when it cannot reach origin/main, rather
      # than silently skipping the comparison it exists to make, so the ref
      # has to be here before it runs.
      - name: make origin/main reachable for the comparison checks
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - run: node tools/ship-check.mjs
      - run: node tools/inventory.mjs > /dev/null
      - name: the committed inventory describes this build
        run: |
          V=$(grep -o 'name="app-version" content="[0-9.]*"' index.html | grep -o '[0-9][0-9.]*')
          grep -q "v$V" audit/inventory/FUNCTION-INVENTORY.md \
            || (echo "::error::audit/inventory/FUNCTION-INVENTORY.md is from an older version than index.html (v$V) — run 'node tools/inventory.mjs' and commit it" && exit 1)

  full:
    # ~12 minutes, real Chromium. The whole matrix.
    name: full (the whole matrix, in a real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: make origin/main reachable for the comparison checks
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: install Playwright where the harness imports it from
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSION}"
          npx --no-install playwright install --with-deps chromium
      - name: prove the harness can actually reach Playwright before running anything
        # Without this, a missing package shows up as 35 separate
        # "the check itself threw" rows and looks like 35 app defects.
        run: node -e "import('./tools/harness.mjs').then(h=>h.playwright()).then(p=>console.log('playwright', p.chromium?'OK':'MISSING'))"
      - run: node tools/audit-all.mjs
      - name: keep the matrix as an artifact whether it passed or not
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-matrix
          path: |
            audit/FEATURE-MATRIX.md
            audit/inventory/
