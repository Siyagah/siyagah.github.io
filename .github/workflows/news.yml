# Siyagah's own news service (v05.37, Z13c). Every 15 minutes it runs news/fetch.mjs (the app's own news helper, in Node) for the
# channels in news/channels.json and publishes the answer as news.json, the ONLY file on the branch `news` (one commit, force-pushed,
# so the branch never grows a history). The app reads it from raw.githubusercontent.com. Nothing about the owner's notes is involved.
# A run where every channel failed publishes nothing, so the app keeps the last good headlines.
name: News
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch the headlines
        run: |
          node news/fetch.mjs > "$RUNNER_TEMP/news.json"
          node -e "const j=require(process.argv[1]);if(!j.chans.some(c=>c.ok))process.exit(1)" "$RUNNER_TEMP/news.json"
      - name: Publish to the news branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d); cd "$d"
          git init -q; git checkout -q --orphan news
          cp "$RUNNER_TEMP/news.json" news.json
          git add news.json
          git -c user.name='Siyagah news' -c user.email='news@users.noreply.github.com' commit -qm "news $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news
